# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R demo _site/demo
          cp -R src _site/src
          cp -R data _site/data
          touch _site/.nojekyll
          printf 'zipcode.chiaki.ch' > _site/CNAME
          # Serve the demo at the site root. Its assets stay under demo/ so the
          # relative paths in app.js (../src, ../data) resolve exactly as they do
          # when the repo is served locally; only the two asset refs move.
          sed 's|"\./style\.css"|"./demo/style.css"|; s|"\./app\.js"|"./demo/app.js"|' \
            demo/index.html > _site/index.html
          printf '<meta http-equiv="refresh" content="0; url=/">' > _site/demo/index.html
          # The bundle under src/ and data/ is ~4MB of machine-readable index with
          # nothing to rank for, so keep crawlers on the one page that matters.
          cat > _site/robots.txt <<'ROBOTS'
          User-agent: *
          Allow: /
          Disallow: /data/
          Disallow: /src/
          Sitemap: https://zipcode.chiaki.ch/sitemap.xml
          ROBOTS
          cat > _site/sitemap.xml <<SITEMAP
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://zipcode.chiaki.ch/</loc>
              <lastmod>$(date -u +%F)</lastmod>
            </url>
          </urlset>
          SITEMAP
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
