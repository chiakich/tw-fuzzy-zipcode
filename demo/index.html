<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

      name="description"
      content="輸入台灣地址或者郵政信箱進行模糊比對，查詢郵局 3+3 郵遞區號並翻成英文地址，支援台／臺與中文數字寫法，純本機瀏覽器運算。"
    />

    <meta property="og:type" content="website" />

    <meta property="og:locale" content="zh_TW" />
    <meta property="og:title" content="台灣郵遞區號與地址英譯查詢 | 千秋稻荷社" />
    <meta
      property="og:description"
      content="輸入台灣地址或者郵政信箱進行模糊比對，查詢郵局 3+3 郵遞區號並翻成英文地址。純本機瀏覽器運算。"
    />

      content="輸入台灣地址或者郵政信箱進行模糊比對，查詢郵局 3+3 郵遞區號並翻成英文地址。純本機瀏覽器運算。"
    />

    <!-- Inlined so it resolves the same whether the page is served at / or /demo/. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234c6ef5'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3E%E9%83%B5%3C/text%3E%3C/svg%3E"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "台灣郵遞區號查詢",
        "url": "https://zipcode.chiaki.ch/",
        "description": "輸入台灣地址或者郵政信箱進行模糊比對，查詢郵局 3+3 郵遞區號並翻成英文地址。純本機瀏覽器運算。",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "需支援 ES modules 的瀏覽器",
        "inLanguage": "zh-Hant-TW",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TWD" },
        "author": { "@type": "Person", "name": "涼風千秋", "url": "https://chiaki.ch/profile" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://zipcode.chiaki.ch/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        },
        "sourceOrganization": {
          "@type": "Organization",
          "name": "中華郵政",
          "url": "https://www.post.gov.tw/"
        }
      }
    </script>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="search-panel" aria-labelledby="page-title">
        <h1 id="page-title">台灣郵遞區號與地址英譯查詢</h1>
        <p class="description">輸入地址查詢郵遞區號與英文地址</p>

        <div class="search-area">
          <form id="search-form" novalidate>
            <div class="search-box">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
              </svg>
              <input
                id="address"
                name="address"
                type="search"
                aria-label="輸入地址"
                placeholder="例如：臺北市信義區市府路1號"
                autocomplete="street-address"
                enterkeyhint="search"
              />
              <button class="clear-button" type="button" aria-label="清除地址" hidden>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
              </button>
            </div>
          </form>

          <section id="suggestions" class="suggestions" aria-label="搜尋建議" hidden></section>
        </div>

        <div id="result" class="result" aria-live="polite" hidden></div>
      </section>
    </main>
    <footer>
      <span>資料來源：中華郵政 3+3 郵遞區號</span>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/chiakich/tw-fuzzy-zipcode">GitHub</a>
      <span aria-hidden="true">·</span>
      <a href="https://chiaki.ch/profile">製作：涼風千秋</a>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
