<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#202124" media="(prefers-color-scheme: dark)" />
    <title>台灣郵遞區號查詢</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="search-panel" aria-labelledby="page-title">
        <h1 id="page-title">台灣郵遞區號查詢</h1>
        <p class="description">輸入地址查詢郵遞區號</p>

        <div class="search-area">
          <form id="search-form" novalidate>
            <div class="search-box">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m21 21-4.35-4.35m2.35-5.15a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z" />
              </svg>
              <input
                id="address"
                name="address"
                type="search"
                aria-label="輸入地址"
                placeholder="例如：臺北市信義區市府路1號"
                autocomplete="street-address"
                enterkeyhint="search"
              />
              <button class="clear-button" type="button" aria-label="清除地址" hidden>
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
              </button>
            </div>
          </form>

          <section id="suggestions" class="suggestions" aria-label="搜尋建議" hidden></section>
        </div>

        <div id="result" class="result" aria-live="polite" hidden></div>
      </section>
    </main>
    <footer>
      <span>資料來源：中華郵政 3+3 郵遞區號</span>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/chiakich/tw-fuzzy-zipcode">GitHub</a>
      <span aria-hidden="true">·</span>
      <a href="https://chiaki.ch/profile">製作：涼風千秋</a>
    </footer>
    <script type="module" src="./app.js"></script>
  </body>
</html>
